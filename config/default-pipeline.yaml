# OneWord default pipeline definition.
#
# Installed to ~/.oneword/config/ by the installers and read by the skills:
#   - oneword-verify reads quality_gates (embedded defaults apply if this file is absent)
#
# NOTE on template matching: the single source of truth for matching rules is
# skills/oneword-techstack.md ("Matching Rules" section) — do NOT duplicate them
# here; duplicated rule lists drift apart over time.

pipeline:
  steps:
    - name: analyze
      skill: oneword-analyze
      output: .oneword/requirements.md
    - name: techstack
      skill: oneword-techstack
      input: .oneword/requirements.md
      output: .oneword/tech-stack.md
    - name: usecases
      skill: oneword-usecases
      input: [.oneword/requirements.md, .oneword/tech-stack.md]
      output: .oneword/use-cases.md
    - name: design
      skill: oneword-design
      input: [.oneword/requirements.md, .oneword/use-cases.md, .oneword/tech-stack.md]
      output: .oneword/design.md
    - name: code
      skill: oneword-code
      input: [.oneword/design.md, .oneword/use-cases.md, .oneword/tech-stack.md]
      output: [src/, tests/unit/, tests/integration/]
    - name: e2e
      skill: oneword-e2e
      input: [.oneword/use-cases.md, .oneword/tech-stack.md]
      output: tests/e2e/
    - name: verify
      skill: oneword-verify
      input: [.oneword/tech-stack.md]
      output: .oneword/test-report.md
    - name: deliver
      skill: oneword-deliver
      input: [.oneword/requirements.md, .oneword/tech-stack.md, .oneword/test-report.md]
      output: README.md

# Entry-point skills that live outside the linear pipeline:
#   oneword-iterate — incremental change requests on a finished app
#   oneword-resume  — resume an interrupted build / report status
#   oneword-doctor  — environment pre-flight check

failure_policy:
  doc_stages: [analyze, usecases, design]
  doc_max_retries: 1
  fallback_template: react-node
  # Two retry layers, see skills/oneword-build.md "Retry semantics":
  verify_test_level_retries: 3   # inside oneword-verify's auto-fix loop
  verify_structural_retries: 1   # orchestrator re-runs oneword-code in fix mode

quality_gates:
  test_pass_rate: 100
  test_coverage_min: 80          # enforced where coverage tooling exists; otherwise N/A
  lint_pass: true
  build_pass: true
  startup_pass: true
  security_audit: high           # fail on HIGH/CRITICAL dependency advisories & hardcoded secrets
