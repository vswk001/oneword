name: react-flask
display: "React + Flask"
description: "Lightweight full-stack application with React frontend and Flask API backend"
suitable_for:
  - "Simple API-driven applications"
  - "Lightweight microservices"
  - "Small utility web apps"
  - "Prototypes and MVPs"
tech:
  frontend: React + TypeScript + Tailwind CSS
  backend: Python + Flask
  database: JSON file storage (zero-config, data/ directory)
  testing: Pytest + Playwright
  build: Vite
  lint: Ruff + ESLint
commands:
  install: pip install -r requirements.txt && cd frontend && npm install
  dev: npx concurrently "flask --app src run --reload" "cd frontend && npm run dev"
  build: cd frontend && npm run build
  test: pytest --cov=src tests/
  lint: ruff check src/
  start: flask --app src run
