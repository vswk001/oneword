name: vue-python
display: "Vue + Python"
description: "Data-intensive full-stack application with Vue.js frontend and Python/FastAPI backend"
suitable_for:
  - "Data analysis and visualization applications"
  - "Machine learning powered web apps"
  - "Report generation systems"
  - "AI-related applications"
tech:
  frontend: Vue 3 + TypeScript + Tailwind CSS
  backend: Python + FastAPI + Pydantic
  database: JSON file storage (zero-config, data/ directory)
  testing: Pytest + Playwright
  build: Vite
  lint: Ruff + ESLint
commands:
  install: pip install -r requirements.txt && cd frontend && npm install
  dev: npx concurrently "uvicorn src.main:app --reload" "cd frontend && npm run dev"
  build: cd frontend && npm run build
  test: pytest --cov=src tests/
  lint: ruff check src/
  start: uvicorn src.main:app
